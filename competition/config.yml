task: object_detection
metric: mAP50-95
metric_direction: maximize

image:
  height: 416
  width: 416
  channels: 3

classes:
  num_classes: 3
  names:
    - fire
    - other
    - smoke

submission:
  format: csv
  required_columns:
    - image_id
    - class_id
    - x_min
    - y_min
    - x_max
    - y_max
    - confidence

  coordinates: pixel
  coordinate_format: xyxy
  confidence_range: [0.0, 1.0]

evaluation:
  metric: COCO_mAP
  iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  max_detections_per_image: 100
