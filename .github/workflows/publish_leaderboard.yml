
name: Publish Leaderboard

on:
  workflow_run:
    workflows: ["Score Submission"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-leaderboard
  cancel-in-progress: false

jobs:
  render:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the main branch
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Create the leaderboard directory
      - name: Prepare leaderboard directory
        run: mkdir -p leaderboard

      # 4. Render the leaderboard
      - name: Render leaderboard
        run: python competition/render_leaderboard.py

      # 5. Commit the updated leaderboard
      - name: Commit rendered leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add leaderboard/leaderboard.md

          if git diff --cached --quiet; then
            echo "No leaderboard changes."
            exit 0
          fi

          git commit -m "Render updated leaderboard"
          git push origin main
