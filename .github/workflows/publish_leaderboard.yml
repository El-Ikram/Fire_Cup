
name: Publish Leaderboard

on:
  workflow_run:
    workflows: ["Score Submission"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pandas

      - name: Render leaderboard
        run: python competition/render_leaderboard.py

      - name: Commit rendered leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/leaderboard.html

          git commit -m "Render updated leaderboard" || exit 0

          git push origin main
